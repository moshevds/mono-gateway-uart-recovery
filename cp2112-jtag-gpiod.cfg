# CP2112 GPIO JTAG through Linux gpiod
# Change this to match /dev/gpiochipN from gpiodetect.
set CP2112_CHIP 1

adapter driver linuxgpiod
transport select jtag

adapter gpio tdo 3 -chip $CP2112_CHIP
adapter gpio tck 5 -chip $CP2112_CHIP -active-high -push-pull -init-inactive
adapter gpio tms 6 -chip $CP2112_CHIP -active-high -push-pull -init-active
adapter gpio tdi 7 -chip $CP2112_CHIP -active-high -push-pull -init-inactive

adapter gpio srst 4 -chip $CP2112_CHIP -active-low
reset_config srst_only srst_open_drain
